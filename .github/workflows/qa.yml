name: Flowers project checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  project-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate project structure and authored UI
        run: python tools/qa.py
