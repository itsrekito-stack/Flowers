name: Flowers project checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  project-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install persistence test runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install pinned Rojo CLI
        run: |
          curl -fLsS --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo
          echo /tmp/rojo >> "$GITHUB_PATH"
      - name: Install pinned Lune for Luau and world tests
        run: |
          curl -fLsS --retry 3 -o /tmp/lune.zip https://github.com/lune-org/lune/releases/download/v0.11.0/lune-0.11.0-linux-x86_64.zip
          echo "5a0ea32c3e13e5e3b1dc415c2056bcfe44258b3a811dcd473c50e3b437d10f72  /tmp/lune.zip" | sha256sum -c -
          unzip -q /tmp/lune.zip -d /tmp/lune
          chmod +x /tmp/lune/lune
          echo /tmp/lune >> "$GITHUB_PATH"
      - name: Validate persistence, authored world and Luau
        run: python tools/qa.py
      - name: Build Roblox place with Rojo
        run: /tmp/rojo/rojo build default.project.json -o /tmp/FlowersQA.rbxl

